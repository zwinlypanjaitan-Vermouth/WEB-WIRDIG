<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Teman Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Teman Digital" class="logo-img" onerror="this.style.display='none'">Teman Digital<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="checkout.html">Keranjang</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Ganti mode gelap/terang">🌙</button>
      <a href="checkout.html" class="cart-btn" aria-label="Keranjang">🛒<span class="cart-badge" data-cart-count style="display:none">0</span></a>
      <div data-auth-slot style="display:flex; gap:8px;"></div>
    </div>
  </div>
</header>

<div class="wrap auth-shell">
  <div class="panel form-narrow" style="width:100%;">
    <h2>Masuk ke akunmu</h2>
    <p>Belum punya akun? <a href="register.html" style="color:var(--brand); font-weight:600;">Daftar dulu</a></p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>

    <div class="dev-note" style="margin-top:20px;">
      <strong>Catatan demo:</strong> akun admin bawaan — email <code>admin@temandigital.id</code>, kata sandi <code>admin123</code>.
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
  function getNextParam() {
    const params = new URLSearchParams(window.location.search);
    return params.get('next') || 'index.html';
  }
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const result = Auth.login(email, password);
    const alertBox = document.getElementById('alertBox');
    if (!result.ok) {
      alertBox.innerHTML = `<div class="alert alert-error">${result.error}</div>`;
      return;
    }
    window.location.href = getNextParam();
  });
</script>
</body>
</html>
