<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akun Saya — Teman Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Teman Digital" class="logo-img" onerror="this.style.display='none'">Teman Digital<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="checkout.html">Keranjang</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Ganti mode gelap/terang">🌙</button>
      <a href="checkout.html" class="cart-btn" aria-label="Keranjang">🛒<span class="cart-badge" data-cart-count style="display:none">0</span></a>
      <div data-auth-slot style="display:flex; gap:8px;"></div>
    </div>
  </div>
</header>

<div class="wrap section">
  <div class="two-col">
    <div>
      <h2>Riwayat transaksi</h2>
      <div class="table-wrap">
        <table class="data" id="orderTable">
          <thead>
            <tr><th>No. Pesanan</th><th>Produk</th><th>Total</th><th>Metode</th><th>Status</th><th>Tanggal</th></tr>
          </thead>
          <tbody id="orderTbody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="orderEmpty" style="display:none;">
        <h3>Belum ada transaksi</h3>
        <p>Transaksi kamu akan muncul di sini.</p>
        <a href="index.html" class="btn btn-primary">Mulai belanja</a>
      </div>
    </div>

    <div class="panel">
      <h4 style="margin-top:0;">Profil</h4>
      <div id="profileBox"></div>
      <a href="admin.html" class="btn btn-ghost btn-block" id="adminLink" style="margin-top:14px; display:none;">Buka panel admin</a>
    </div>
  </div>
</div>

<nav class="tabbar-mobile">
  <a href="index.html">🏠<span>Beranda</span></a>
  <a href="checkout.html">🛒<span>Keranjang</span></a>
  <a href="akun.html" class="active">👤<span>Akun</span></a>
</nav>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
  if (Auth.requireLogin('akun.html')) {
    const user = Auth.currentUser();

    document.getElementById('profileBox').innerHTML = `
      <p style="margin-bottom:6px;"><strong>${user.name}</strong></p>
      <p style="margin-bottom:6px; color:var(--ink-soft); font-size:0.88rem;">${user.email}</p>
      <p style="color:var(--ink-soft); font-size:0.88rem;">${user.phone}</p>
    `;
    if (user.role === 'admin') document.getElementById('adminLink').style.display = 'block';

    const orders = Orders.byUser(user.id);
    const tbody = document.getElementById('orderTbody');
    if (orders.length === 0) {
      document.getElementById('orderTable').style.display = 'none';
      document.getElementById('orderEmpty').style.display = 'block';
    } else {
      function renderOrders() {
        tbody.innerHTML = Orders.byUser(user.id).map(o => `
          <tr>
            <td class="mono">${o.id}</td>
            <td>${o.items.map(i => `${i.name} ×${i.qty}`).join(', ')}</td>
            <td class="mono">${formatRupiah(o.total)}</td>
            <td>${o.method}</td>
            <td><span class="status-pill status-${o.status === 'sukses' ? 'sukses' : (o.status === 'gagal' ? 'gagal' : 'pending')}">${o.status}</span></td>
            <td>${new Date(o.createdAt).toLocaleString('id-ID')}</td>
          </tr>
        `).join('');
      }
      renderOrders();
      // Refresh berkala untuk menangkap perubahan status simulasi
      setInterval(renderOrders, 1500);
    }
  }
</script>

<div class="floating-contact" id="floatingContact">
  <div class="fc-sub">
    <a href="https://instagram.com/USERNAME_IG_KAMU" target="_blank" rel="noopener" class="fc-btn fc-ig" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/></svg>
    </a>
    <a href="https://wa.me/6285792827315" target="_blank" rel="noopener" class="fc-btn fc-wa" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.4c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2 1 2.4c.1.2 1.6 2.4 3.8 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.3-.5 1.5-1 .2-.5.2-.9.1-1l-.5-.2Z"/></svg>
    </a>
  </div>
  <button type="button" class="fc-main" id="fcMainBtn" aria-label="Hubungi kami">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 3 6.2L4 20l1.8-3A7.96 7.96 0 0 1 4 12Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
  document.getElementById('fcMainBtn').addEventListener('click', () => {
    document.getElementById('floatingContact').classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const fc = document.getElementById('floatingContact');
    if (!fc.contains(e.target)) fc.classList.remove('open');
  });
</script>
</body>
</html>
