<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Teman Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Teman Digital" class="logo-img" onerror="this.style.display='none'">Teman Digital<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="checkout.html">Keranjang</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Ganti mode gelap/terang">🌙</button>
      <a href="checkout.html" class="cart-btn" aria-label="Keranjang">🛒<span class="cart-badge" data-cart-count style="display:none">0</span></a>
      <div data-auth-slot style="display:flex; gap:8px;"></div>
    </div>
  </div>
</header>

<div class="wrap auth-shell">
  <div class="panel form-narrow" style="width:100%;">
    <h2>Buat akun baru</h2>
    <p>Sudah punya akun? <a href="login.html" style="color:var(--brand); font-weight:600;">Masuk di sini</a></p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Nama lengkap</label>
        <input type="text" id="name" required placeholder="Nama kamu">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>
      <div class="field">
        <label for="phone">Nomor HP</label>
        <input type="tel" id="phone" required pattern="^(0|62|\+62)8[0-9]{8,11}$" title="Format nomor HP Indonesia, contoh: 08123456789" placeholder="08xxxxxxxxxx">
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Daftar</button>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const result = Auth.register({ name, email, phone, password });
    const alertBox = document.getElementById('alertBox');
    if (!result.ok) {
      alertBox.innerHTML = `<div class="alert alert-error">${result.error}</div>`;
      return;
    }
    window.location.href = 'index.html';
  });
</script>

<div class="floating-contact" id="floatingContact">
  <div class="fc-sub">
    <a href="https://instagram.com/USERNAME_IG_KAMU" target="_blank" rel="noopener" class="fc-btn fc-ig" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/></svg>
    </a>
    <a href="https://wa.me/6285792827315" target="_blank" rel="noopener" class="fc-btn fc-wa" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.4c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2 1 2.4c.1.2 1.6 2.4 3.8 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.3-.5 1.5-1 .2-.5.2-.9.1-1l-.5-.2Z"/></svg>
    </a>
  </div>
  <button type="button" class="fc-main" id="fcMainBtn" aria-label="Hubungi kami">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 3 6.2L4 20l1.8-3A7.96 7.96 0 0 1 4 12Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
  document.getElementById('fcMainBtn').addEventListener('click', () => {
    document.getElementById('floatingContact').classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const fc = document.getElementById('floatingContact');
    if (!fc.contains(e.target)) fc.classList.remove('open');
  });
</script>
</body>
</html>
